{% extends "base.html" %}
{% block title %}Log in · SpendWise{% endblock %}
{% block page_name %}login{% endblock %}
{% block content %}
<section class="auth-card card">
  <h1>Welcome back</h1>
  <p class="muted">Log in to see your expenses. Sessions last 7 days.</p>
  <div id="form-notice" class="alert info" role="status" hidden></div>
  <div id="lock-banner" class="alert error" role="alert" hidden></div>
  <div id="form-error" class="alert error" role="alert" hidden></div>
  <form id="login-form" autocomplete="on" novalidate>
    <label for="username">Username
      <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </label>
    <label for="password">Password
      <input type="password" id="password" autocomplete="current-password" required>
    </label>
    <button class="btn primary block" id="submit-btn" type="submit">Log in</button>
  </form>
  <p class="muted center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
{% block scripts %}<script defer src="{{ url_for('static', filename='js/auth-pages.js') }}"></script>{% endblock %}
